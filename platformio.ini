; ============================================================================
; PlatformIO Project Configuration File
; 项目：ESP32-S3 远程模拟键鼠 + 64KB FAT12 虚拟 U 盘中转系统
; 协议栈：TinyUSB (USBHIDKeyboard + USBHIDMouse + USBMSC) + WiFi + MQTT + NVS
; ============================================================================

[platformio]
; 默认构建环境：标准 ESP32-S3-DevKitC-1（双 Type-C，UART 口烧录，USB-OTG 口模拟键鼠+U盘）
; 如使用 N16R8 (16MB Flash + 8MB OPI PSRAM) 板卡，请执行：pio run -e esp32-s3-n16r8 -t upload
; 如使用单口无串口芯片板卡（如 ESP32-S3-Zero），请执行：pio run -e esp32-s3-single-usb -t upload
default_envs = esp32-s3-devkitc-1

; ----------------------------------------------------------------------------
; 公共配置基类（所有 ESP32-S3 变体自动继承）
; ----------------------------------------------------------------------------
[env]
; 锁定 espressif32 6.9.x（对应稳定 Arduino-ESP32 2.0.17），确保 TinyUSB / tusb.h / Preferences API 兼容
platform = espressif32@^6.9.0
framework = arduino

; 烧录与串口监控配置
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; 分区方案：huge_app.csv 提供 3MB 应用分区，避免 Wi-Fi + WebServer + TinyUSB 固件超出默认 1.28MB 限制
board_build.partitions = huge_app.csv

; 关键编译宏说明：
; 1. ARDUINO_USB_MODE=0          -> 启用原生 USB-OTG (TinyUSB 协议栈)，关闭硬件 CDC/JTAG 独占模式
; 2. ARDUINO_USB_CDC_ON_BOOT=0   -> Serial 日志走 UART0，保持原生 USB 口为纯净 HID 键鼠 + MSC U盘复合设备
; 3. CORE_DEBUG_LEVEL=3          -> 输出 Info 级别系统调试日志（量产可改为 1 或 0）
; 4. MQTT_MAX_PACKET_SIZE=8192   -> 扩大 PubSubClient 缓冲区至 8KB，支持批量 JSON 队列与长段上行文本
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DMQTT_MAX_PACKET_SIZE=8192

; 第三方依赖库
; 注：WiFi / WebServer / DNSServer / Preferences / USB / USBHIDKeyboard / USBHIDMouse / USBMSC 均为内置库
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

; ----------------------------------------------------------------------------
; 环境 1（默认）：标准 ESP32-S3-DevKitC-1（4MB / 8MB QIO Flash，双 Type-C 口）
; ----------------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

; ----------------------------------------------------------------------------
; 环境 2：ESP32-S3 N16R8（16MB Flash + 8MB Octal PSRAM，常见国产 S3 开发板）
; ----------------------------------------------------------------------------
[env:esp32-s3-n16r8]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM

; ----------------------------------------------------------------------------
; 环境 3：单 Type-C 无 UART 芯片板卡（如 ESP32-S3-Zero / SuperMini）
; 开启 TinyUSB CDC，与 HID + MSC 共用同一个原生 USB 口输出日志（首次烧录需按住 BOOT 上电）
; ----------------------------------------------------------------------------
[env:esp32-s3-single-usb]
board = esp32-s3-devkitc-1
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
